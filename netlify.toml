# plumbsleep.com — static landing site.
# Pure static HTML/CSS; no build step needed.

[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # CSP scoped to what the static site actually does: self-hosted assets,
    # nonce infra), data: favicons, Netlify form POSTs to self, and the Tally
    # iframe used by /feedback/.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://tally.so; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src https://fonts.bunny.net; img-src 'self' data:; connect-src 'self'; frame-src https://tally.so; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"

# Long cache for static assets (images, css)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
