  required: true
  prompt: |
    This WO migrates the site to a more honest framing. The engineer MUST surface
    at least one finding where the new copy is now WORSE than the old copy on
    some honest axis (e.g., loses a defensible claim that should have been kept,
    or introduces a hedge that reads as weak when the underlying evidence is
    actually strong). If the migration produces zero such findings, the engineer
    has not been critical enough.

