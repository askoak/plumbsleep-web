# CANONICAL TRUTH (what every page must align to)
# ============================================================
canonical:
  architecture:
    description: "Three-piece kit"
    components:
      - "Sleeve (worn on thigh; Regular ≤28\" or XL 28-32\")"
      - "Elastic open-ended pocket sewn to the sleeve (holds the foam pillow; open-ended so the pillow can be removed mid-night without taking the sleeve off)"
      - "Washable pillowcase (slides over the foam pillow; only laundry-cycle component)"
    superseded_terms:
      - "single-piece sleeve-and-case"
      - "case sewn permanently to the sleeve"
      - "sewn permanently to its body-side surface"
      - "one-piece washable wearable"
      - "Architecture B (package/154)"
      - "the modular three-component design in package/86"  # also stale — package/86 was a precursor of d28
  sizing_nomenclature:
    canonical:
      - "Sleeve Regular (≤28\" thigh circumference)"
      - "Sleeve XL (28\"-32\" thigh circumference)"
      - "Pillow Regular (5\" foam + 1\" plush layer = 6\" total)"
      - "Pillow XL (5\" foam + 1.5\" plush layer = 6.5\" total)"
    superseded_terms:
      - "\"5-inch\" pillow"
      - "\"6-inch\" pillow"
      - "5-inch baseline / 6-inch"
      - "two thicknesses" (vague — must name them)
  corpus_count:
    canonical: "~5,000 unique Amazon reviews"  # per d25 rounding rule
    superseded: "4,962 unique Amazon reviews"
  funding_goal:
    canonical: "$20,000"
    superseded: "$21,000"
  kickstarter_ladder:
    canonical:
      - "$10  Supporter (no reward)"
      - "$35  Donate-a-Kit"
      - "$55  Early Bird (cap 200)"
      - "$65  Standard"
      - "$109 Two-Pack"
  validated_framing:
    canonical:
      - "credible wedge, low-cost proof path, launchable experiment"
      - "the Kickstarter is the diligence"
      - "hypothesis to test"
    superseded:
      - "validated"
      - "we directly solve the #1 documented pain"  # see also sizing_claim_integrity below
      - any phrase that asserts product-market fit before Kickstarter delivers
  sizing_claim_integrity:
    rule: |
      The corpus documents PILLOW-SIZE complaints (head/neck dimension).
      Plumb's headline differentiator is THIGH-CIRCUMFERENCE sleeve sizing.
      These are not the same axis. The Sleeve XL is deferred Stage 2 per d13,
      NOT shipping at launch.
    must_change:
      - any sentence claiming Plumb solves the #1 documented pain (it does not — yet)
      - any claim that XL sleeve ships at launch
    must_preserve:
      - the real argument: "Plumb introduces sleeve sizing in a category where pillow sizing fails. The XL sleeve targeting the documented large-frame segment is on the Stage 2 roadmap."
  retail_price:
    canonical: "$69 USD + $4.99 shipping = $73.99 to door"
    product_price: "$69"
    shipping: "$4.99"
    door_total: "$73.99"
    display_convention: "Show product price and shipping as separate line items on the marketing site. The $73.99 to-door figure may be used as a comparison anchor only on the Kickstarter campaign page itself."
    kickstarter_standard_revised: "$59 (down from d23's $65, per d33 to clear 20% floor)"
    affects:
      - homepage Product JSON-LD price field
      - press kit retail line
      - clinicians MSRP table
      - investors §5 unit economics heading and tables
      - price/49, price/69, price/89 A/B/C landing pages (KEEP if test still running OR delete if test concluded — architect to decide)

